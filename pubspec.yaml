name: next_episode
description: Biblioteca locala de filme si seriale, cu progres si calendar TMDB.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.2
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  dio: ^5.9.0
  drift: ^2.34.4
  path_provider: ^2.1.5
  html: ^0.15.7
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  package_info_plus: ^10.2.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/credits/tmdb.svg
    - assets/legal/
